<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar color="primary" class="sidenav-toolbar">Bienvenido</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matLine>Inicio</span>
      </a>
      <a mat-list-item routerLink="user" routerLinkActive="active-link">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matLine>Usuarios</span>
      </a>
      <a mat-list-item routerLink="product" routerLinkActive="active-link">
        <mat-icon matListItemIcon>sell</mat-icon>
        <span matLine>Productos</span>
      </a>
      <a mat-list-item routerLink="client" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matLine>Clientes</span>
      </a>
      <a mat-list-item routerLink="sale" routerLinkActive="active-link">
        <mat-icon matListItemIcon>monetization_on</mat-icon>
        <span matLine>Vender</span>
      </a>
      <a mat-list-item routerLink="history" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matLine>Historial Ventas</span>
      </a>
      <a mat-list-item routerLink="report" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt</mat-icon>
        <span matLine>Reporte</span>
      </a>

    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="color_menu">
      <button *ngIf="!(isHandset$ | async)" mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <samp class="name_empresa">Biker Cañete</samp>
    </mat-toolbar>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
