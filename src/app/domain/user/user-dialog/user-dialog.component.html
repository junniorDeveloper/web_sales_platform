<mat-dialog-content>
  <h3>Formulario de Usuario</h3>
  <form [formGroup]="userForm" (ngSubmit)="saveUser()">
    <mat-form-field class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" required>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Apellidos</mat-label>
      <input matInput formControlName="surnames" required>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Cargo</mat-label>
      <input matInput formControlName="charge" required>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Celular</mat-label>
      <input matInput formControlName="cellphone" required>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput formControlName="email" required>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" required>
    </mat-form-field>
    <div class="actions">
      <button mat-raised-button color="primary" type="submit">Guardar</button>
      <button mat-button type="button" (click)="closeDialog()">Cancelar</button>
    </div>
  </form>
</mat-dialog-content>
