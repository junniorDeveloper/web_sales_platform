<h1>Registros de Usuarios</h1>
<hr>

<button mat-raised-button color="primary" class="add-user-button" (click)="openDialog()">Agregar Usuario</button>
<button mat-button class="add-lista-button" (click)="toggleList()">Listar {{ showActive ? 'Inactivos' : 'Activos' }}</button>

<hr class="horizontal-line">

<mat-form-field class="search">
  <input matInput placeholder="Buscar usuario" [(ngModel)]="searchTerm" (ngModelChange)="filterUsers()">
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!-- Nombre del Usuario -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
  </ng-container>

  <!-- Apellidos del Usuario -->
  <ng-container matColumnDef="surnames">
    <th mat-header-cell *matHeaderCellDef> Apellidos </th>
    <td mat-cell *matCellDef="let user"> {{ user.surnames }} </td>
  </ng-container>

  <!-- Cargo del Usuario -->
  <ng-container matColumnDef="charge">
    <th mat-header-cell *matHeaderCellDef> Cargo </th>
    <td mat-cell *matCellDef="let user"> {{ user.charge }} </td>
  </ng-container>

  <!-- Teléfono del Usuario -->
  <ng-container matColumnDef="cellphone">
    <th mat-header-cell *matHeaderCellDef> Teléfono </th>
    <td mat-cell *matCellDef="let user"> {{ user.cellphone }} </td>
  </ng-container>

  <!-- Correo Electrónico del Usuario -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Correo Electrónico </th>
    <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let user">
      <button mat-button (click)="toggleUserState(user)">
        {{ user.active === 'A' ? 'Delete' : 'Restaurar' }}
      </button>
      <button mat-button (click)="openDialog(user)">Edit</button>
    </td>
  </ng-container>

  <!-- Definir las columnas a mostrar -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let user; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
