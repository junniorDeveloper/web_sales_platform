<h1>Registros de Productos</h1>
<hr>

<button mat-raised-button color="primary" class="add-product-button" (click)="openDialog()">Agregar Producto</button>
<button mat-button class="add-lista-button" (click)="toggleList()">Listar {{ showActive ? 'Inactivos' : 'Activos' }}</button>

<hr class="horizontal-line">

<mat-form-field class="search">
  <input matInput placeholder="Buscar producto" [(ngModel)]="searchTerm" (ngModelChange)="filterProducts()">
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!-- Código de Producto -->
  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef> Código </th>
    <td mat-cell *matCellDef="let product"> {{ product.code }} </td>
  </ng-container>

  <!-- Nombre del Producto -->
  <ng-container matColumnDef="names">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let product"> {{ product.names }} </td>
  </ng-container>

  <!-- Marca del Producto -->
  <ng-container matColumnDef="brand">
    <th mat-header-cell *matHeaderCellDef> Marca </th>
    <td mat-cell *matCellDef="let product"> {{ product.brand }} </td>
  </ng-container>

  <!-- Modelo del Producto -->
  <ng-container matColumnDef="model">
    <th mat-header-cell *matHeaderCellDef> Modelo </th>
    <td mat-cell *matCellDef="let product"> {{ product.model }} </td>
  </ng-container>

  <!-- Precio del Producto -->
  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef> Precio </th>
    <td mat-cell *matCellDef="let product"> {{ product.price | currency }} </td>
  </ng-container>

  <!-- Descripción del Producto -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef> Descripción </th>
    <td mat-cell *matCellDef="let product"> {{ product.description }} </td>
  </ng-container>

  <!-- Stock del Producto -->
  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef> Stock </th>
    <td mat-cell *matCellDef="let product"> {{ product.stock }} </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let product">
      <button mat-button (click)="accionProducto(product)">
        {{ product.states === 'A' ? 'Eliminar' : 'Restaurar' }}
      </button>
      <button mat-button (click)="openDialog(product)">Editar</button>
    </td>
  </ng-container>


  <!-- Definir las columnas a mostrar -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let product; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 15, 20]" showFirstLastButtons></mat-paginator>
