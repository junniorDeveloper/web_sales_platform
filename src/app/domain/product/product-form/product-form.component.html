<mat-dialog-content>
  <h3>Formulario de Productos</h3>
  <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
    <mat-form-field class="full-width">
      <mat-label>Código</mat-label>
      <input matInput placeholder="Código" formControlName="code">
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput placeholder="Nombre" formControlName="names">
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Marca</mat-label>
      <input matInput placeholder="Marca" formControlName="brand">
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Modelo</mat-label>
      <input matInput placeholder="Modelo" formControlName="model">
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Precio</mat-label>
      <input matInput placeholder="Precio" formControlName="price">
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput placeholder="Descripción" formControlName="description"></textarea>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Stock</mat-label>
      <input matInput placeholder="Stock" formControlName="stock">
    </mat-form-field>

    <div mat-dialog-actions>
      <button mat-raised-button color="primary" type="submit">Guardar</button>
      <button mat-button type="button" (click)="closeDialog()">Cancelar</button>
    </div>
  </form>
</mat-dialog-content>
